<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1a16;--muted:#6f6a62;--ac:#0f4c5c;--line:#e6e0d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Noto Sans KR","Noto Sans SC","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;line-height:1.25;margin:6px 0 2px}.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 15px system-ui;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
h2{font-size:16px;margin:0 0 8px;color:var(--ac);letter-spacing:.2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #f0ebe3}.row:last-child{border:0}
.row span{color:var(--muted)}.row b{text-align:right;word-break:break-all}.row b a{white-space:nowrap}
.btn{display:inline-block;border:0;background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font:700 15px system-ui;cursor:pointer;text-decoration:none}
.btn.ghost{background:#eef4f5;color:var(--ac)}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.taxi{background:#fffdf6}.taxi .ko{font-size:24px;font-weight:800;line-height:1.35;margin:6px 0}.taxi .say{font-size:20px;font-weight:700}
.links{display:grid;gap:8px}.links a{display:block;background:#eef4f5;color:var(--ac);border-radius:12px;padding:12px 14px;text-decoration:none;font-weight:700}
.links small{display:block;font-weight:400;color:var(--muted)}
.sos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.sos a{background:#fff3f0;color:#9a2b1a;border-radius:12px;padding:10px 4px;text-decoration:none;font-weight:800}.sos small{display:block;font-weight:500;color:#7a4a40;font-size:12px}
.note{color:var(--muted);font-size:13px}
#big{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px;z-index:9}#big[hidden]{display:none}
#big .say{font-size:30px;font-weight:800;margin:0 0 14px}#big .ko{font-size:38px;font-weight:900;line-height:1.3}#big button{margin-top:28px;align-self:flex-start}
.err{padding:40px 16px;text-align:center;color:var(--muted)}
</style></head>

 trash:{ko:'쓰레기를 한곳에 모아 주세요.',en:'Please gather your trash in one place.',zh:'请把垃圾集中放在一处。',tw:'請把垃圾集中放在一處。',ja:'ゴミは一か所にまとめてください。',id:'Mohon kumpulkan sampah di satu tempat.',vi:'Vui lòng gom rác vào một chỗ.',th:'กรุณารวบรวมขยะไว้ที่เดียว'},
 power:{ko:'에어컨·난방과 불을 꺼 주세요.',en:'Please turn off the air conditioner, heater and lights.',zh:'请关闭空调、暖气和灯。',tw:'請關閉冷氣、暖氣和燈。',ja:'エアコン・暖房と電気を消してください。',id:'Mohon matikan AC, pemanas, dan lampu.',vi:'Vui lòng tắt điều hòa, máy sưởi và đèn.',th:'กรุณาปิดแอร์ ฮีตเตอร์ และไฟ'},
 dishes:{ko:'쓴 그릇은 설거지해 주세요.',en:'Please wash the dishes you used.',zh:'请把用过的餐具洗干净。',tw:'請把用過的餐具洗乾淨。',ja:'使った食器は洗ってください。',id:'Mohon cuci piring yang sudah dipakai.',vi:'Vui lòng rửa bát đĩa đã dùng.',th:'กรุณาล้างจานที่ใช้แล้ว'},
 msg:{ko:'나가실 때 호스트에게 메시지를 보내 주세요.',en:'Please message your host when you check out.',zh:'退房时请给房东发消息。',tw:'退房時請傳訊息給房東。',ja:'チェックアウトの際はホストにメッセージをお送りください。',id:'Mohon kirim pesan ke tuan rumah saat check-out.',vi:'Vui lòng nhắn tin cho chủ nhà khi trả phòng.',th:'กรุณาส่งข้อความถึงเจ้าของที่พักเมื่อเช็คเอาท์'}
};
const BASE='https://wayfen-games.github.io/wayfen-tools/';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function decode(h){
  if(h.startsWith('z')){if(typeof DecompressionStream!=='function')throw 'old';const b=atob(h.slice(1).replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
    const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
  if(h.startsWith('j')) return JSON.parse(decodeURIComponent(h.slice(1)));
  throw 0}
let D=null,L='en';
const OK=l=>LANGS.some(x=>x[0]===l);
function pick(){try{const s=localStorage.getItem('guest.lang');if(OK(s))return s}catch(e){}
  const n=(navigator.language||'').toLowerCase();return /^ko/.test(n)?'ko':/^zh-(tw|hk|mo|hant)/.test(n)?'tw':/^zh/.test(n)?'zh':/^ja/.test(n)?'ja':/^(id|in|ms)/.test(n)?'id':/^vi/.test(n)?'vi':/^th/.test(n)?'th':'en'}
function t(k){return T[k][L]||T[k].en}
function render(){
  document.documentElement.lang=HTML_LANG[L]; document.title=(D.ne||D.n||'Guest Guide')+' · '+t('welcome');
  const q=L==='en'?'':'?lang='+L;
  const rules=(D.r||[]).filter(k=>RULES[k]).map(k=>`<li>${esc(RULES[k][L])}${L!=='ko'?`<br><small class="note" lang="ko">${esc(RULES[k].ko)}</small>`:''}</li>`).join('');
  const outs=(D.o||[]).filter(k=>OUT[k]).map(k=>`<li>${esc(OUT[k][L])}</li>`).join('');
  const contact=[D.ct?`<div class="row"><span>${esc(D.ct)}</span><b>${esc(D.cid||'')}</b></div>`:'',D.ph?`<div class="row"><span>☎</span><b><a href="tel:${esc(D.ph.replace(/[^0-9+]/g,''))}">${esc(D.ph)}</a></b></div>`:''].join('');
  $('#app').innerHTML=`
  <p class="sub" style="margin:0">${esc(t('welcome'))}</p><h1>${esc(L==='ko'?(D.n||D.ne):(D.ne||D.n))}</h1>${D.ne&&D.n&&L!=='ko'?`<p class="sub" lang="ko">${esc(D.n)}</p>`:''}
  <div class="langs">${LANGS.map(([k,n])=>`<button type="button" data-l="${k}" aria-pressed="${k===L}" lang="${HTML_LANG[k]}">${n}</button>`).join('')}</div>
  ${D.w?`<section><h2>${t('wifi')}</h2><div class="row"><span>${t('net')}</span><b>${esc(D.w)}</b></div><div class="row"><span>${t('pw')}</span><b>${D.p?esc(D.p):t('nopw')}</b></div>${D.p?`<p style="margin:10px 0 0"><button class="btn ghost" id="cp" type="button">${t('copy')}</button></p>`:''}</section>`:''}
  ${(D.ci||D.co||D.bf)?`<section><h2>${t('stay')}</h2>${D.ci?`<div class="row"><span>${t('ci')}</span><b>${esc(D.ci)}</b></div>`:''}${D.co?`<div class="row"><span>${t('co')}</span><b>${esc(D.co)}</b></div>`:''}${D.bf?`<div class="row"><span>${t('bf')}</span><b>${esc(D.bf)}</b></div>`:''}</section>`:''}
  ${rules?`<section><h2>${t('rules')}</h2><ul>${rules}</ul></section>`:''}
  ${outs?`<section><h2>${t('leave')}</h2><ul>${outs}</ul></section>`:''}
  ${D.a?`<section class="taxi"><h2>${t('taxi')}</h2><p class="say" lang="ko">이 주소로 가 주세요.</p><p class="ko" lang="ko">${esc(D.a)}</p>${D.bd?`<p lang="ko" style="margin:0 0 6px;font-weight:700">${esc(D.bd)}</p>`:''}${D.st?`<div class="row"><span>${t('near')}</span><b lang="ko">${esc(D.st)}</b></div>`:''}${D.ph?`<div class="row"><span>${t('hostph')}</span><b><a href="tel:${esc(D.ph.replace(/[^0-9+]/g,''))}">${esc(D.ph)}</a></b></div>`:''}<p class="note">${t('shot')}</p><p style="margin:10px 0 0"><button class="btn" id="bigBtn" type="button">${t('big')}</button></p></section>`:''}
  ${contact?`<section><h2>${t('contact')}</h2>${contact}</section>`:''}
  ${D.x?`<section><h2>${t('msg')}</h2><p lang="ko" style="white-space:pre-wrap;margin:0">${esc(D.x)}</p></section>`:''}
  <section><h2>${t('help')}</h2><div class="links"><a href="${BASE}food/${q}">${t('food')}<small>${t('free')}</small></a><a href="${BASE}pharmacy/${q}">${t('pharm')}<small>${t('free')}</small></a></div></section>
  <section><h2>${t('sos')}</h2><div class="sos"><a href="tel:119">119<small>${t('fire')}</small></a><a href="tel:112">112<small>${t('police')}</small></a><a href="tel:1330">1330<small>${t('tour')}</small></a></div></section>
  <p class="note">${t('app1330')}</p><p class="note">${t('by')}</p>`;
  document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('guest.lang',L)}catch(e){}render()});
  const cp=$('#cp'); if(cp) cp.onclick=async()=>{try{await navigator.clipboard.writeText(D.p);cp.textContent='✓ '+t('copied')}catch(e){window.prompt('',D.p)}};
  const bb=$('#bigBtn'); if(bb) bb.onclick=()=>{$('#bigAddr').textContent=D.a;$('#bigSt').textContent=[D.bd,D.st,D.ph?'☎ '+D.ph:''].filter(Boolean).join('\n');$('#big').hidden=false;history.pushState({big:1},'')};
}
$('#bigClose').onclick=()=>history.back();
addEventListener('popstate',()=>{$('#big').hidden=true});
(async()=>{const h=location.hash.slice(1);L=pick();
  try{D=await decode(h);if(!D||typeof D!=='object')throw 0;['r','o'].forEach(k=>{if(!Array.isArray(D[k]))delete D[k]})}catch(e){$('#app').innerHTML=`<p class="err">${esc((e==='old'?T.old:T.bad)[L])}</p>`;return}
  const q=new URLSearchParams(location.search).get('lang');if(OK(q))L=q;render()})();
</script></body></html>
