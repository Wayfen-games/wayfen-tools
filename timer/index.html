<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: 한 화면 앱. 곡 그림을 흐리게 깐 배경 위에 큰 원형 타이머, 아래에 모드·재생 버튼, 맨 아래 곡 목록. 아늑한 밤 분위기로 한 가지 테마로 고정. */
:root{
  --bg:#1b1612; --ink:#f6efe6; --muted:#c9bcae; --glass:rgba(27,22,18,.62); --line:rgba(246,239,230,.18);
  --accent:#f2b36b; --rest:#9ccfb3; --f-d:"Fraunces",Georgia,serif; --f:"Nunito Sans",system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.bgart{position:fixed;inset:0;z-index:0;background:#1b1612 center/cover no-repeat;filter:blur(2px) brightness(.55);transform:scale(1.04);transition:background-image .6s}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;display:grid;gap:16px;padding-top:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font:700 22px/1.1 var(--f-d);margin:0;letter-spacing:.2px} h1 small{display:block;font:600 12px var(--f);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.count{font:600 13px var(--f);color:var(--muted);white-space:nowrap}
.dial{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:6px auto 0}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:8}
.dial .track{stroke:var(--line)} .dial .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s}
.dial .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.time{font:500 clamp(48px,16vw,76px)/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:1px}
.phase{font:800 13px var(--f);letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 14px var(--f);padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:800 18px var(--f);cursor:pointer;backdrop-filter:blur(6px)}
.play{width:76px;height:76px;border:0;background:var(--accent);color:#2a1b0c;font-size:26px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.now{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px;backdrop-filter:blur(8px)}
.now .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.now b{font:700 16px var(--f-d)} .now span{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tracks{display:grid;gap:6px}
.trk{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px;border-radius:10px;cursor:pointer;font:600 14px var(--f)}
.trk img{width:56px;height:32px;object-fit:cover;border-radius:6px}
.trk[aria-current="true"]{border-color:var(--line);background:rgba(246,239,230,.06);color:var(--accent)}
.foot{font-size:13px;color:var(--muted);text-align:center;display:grid;gap:4px}
.foot a{color:var(--accent);font-weight:800;text-decoration:none}
@media (prefers-reduced-motion:reduce){.dial .prog{transition:none}.bgart{transition:none}}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;min-width:170px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)} .langmenu button{background:none;border:0;color:inherit;font:15px system-ui;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer} .langmenu button:hover,.langmenu button[aria-current="true"]{background:rgba(255,255,255,.12)}
</style>

<div class="bgart" id="bgart"></div>
<div class="wrap">
  <header>
    <h1><span data-t="title">Wayfen Study Timer</span><small data-t="sub">lofi focus timer</small></h1>
    <span style="display:flex;gap:8px;align-items:center"><span class="count" id="count">0 sessions today</span><span style="position:relative"><button class="chip" id="lang" style="padding:4px 10px;font-size:12px" aria-label="Language" aria-haspopup="true" aria-expanded="false">🌐</button><span id="langMenu" class="langmenu" hidden></span></span></span>
  </header>

  <div class="dial" role="timer" aria-live="off">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="92"/><circle class="prog" id="prog" cx="100" cy="100" r="92"/></svg>
    <div class="mid"><div class="time" id="time">25:00</div><div class="phase" id="phase">Focus</div></div>
  </div>

  <div class="modes" role="group" aria-label="Timer length">
    <button class="chip" id="m25" aria-pressed="true" data-f="25" data-r="5">25 · 5</button>
    <button class="chip" id="m50" aria-pressed="false" data-f="50" data-r="10">50 · 10</button>
    <button class="chip" id="m90" aria-pressed="false" data-f="90" data-r="20">90 · 20</button>
  </div>

  <div class="ctrl">
    <button class="round" id="reset" aria-label="Reset timer">↺</button>
    <button class="round play" id="play" aria-label="Start">▶</button>
    <button class="round" id="skip" aria-label="Skip to next phase">⏭</button>
  </div>

  <div class="now">
    <div class="row"><div><b id="tTitle">Bookshop Afternoon</b><br><span>Wayfen Sounds · lofi</span></div>
      <button class="round" id="next" aria-label="Next song" style="width:44px;height:44px;font-size:15px">♪⏭</button></div>
    <label style="display:grid;gap:2px;font-size:12px;color:var(--muted)"><span data-t="vol">Music volume</span><input type="range" id="vol" min="0" max="100" value="60"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)"><input type="checkbox" id="restMusic" checked style="accent-color:var(--accent)"> <span data-t="rest">Keep music on during breaks</span></label>
    <div class="tracks" id="tracks"></div>
  </div>

  <div class="foot">
    <span>Music by Wayfen Sounds.</span>
    <span><span data-t="more">More long mixes on YouTube:</span> <a href="https://www.youtube.com/@WayfenSounds" target="_blank" rel="noopener">Wayfen Sounds</a></span>
    <span><span data-t="stream">Listen anywhere:</span> <a href="https://open.spotify.com/artist/6rmPB6j6p68z4COHetx3Wj" target="_blank" rel="noopener">Spotify</a> · <a href="https://music.apple.com/kr/artist/wayfen-sounds/6815644180" target="_blank" rel="noopener">Apple Music</a></span>
  </div>
</div>
<audio id="aud" preload="auto"></audio>

<script>
// 언어: ?lang=ko|en > 저장값 > 폰 언어
const T = {
  en: {title:'Wayfen Study Timer', sub:'lofi focus timer', vol:'Music volume', rest:'Keep music on during breaks', more:'More long mixes on YouTube:', stream:'Listen anywhere:',
       focus:'Focus', brk:'Break', sess:n=>`${n} session${n===1?'':'s'} today`, start:'Start', pause:'Pause', reset:'Reset timer', skip:'Skip to next phase', next:'Next song'},
  ko: {title:'Wayfen 공부 타이머', sub:'로파이 집중 타이머', vol:'음악 소리', rest:'쉬는 시간에도 음악 켜 두기', more:'더 긴 믹스는 유튜브에서:', stream:'음원 사이트에서 듣기:',
       focus:'집중', brk:'휴식', sess:n=>`오늘 ${n}번 완료`, start:'시작', pause:'일시정지', reset:'처음으로', skip:'다음 단계로', next:'다음 곡'},
  tw: {title:'Wayfen 讀書計時器', sub:'Lo-fi 專注計時器', vol:'音樂音量', rest:'休息時也播放音樂', more:'更長的混音在 YouTube：', stream:'在各音樂平台收聽：',
       focus:'專注', brk:'休息', sess:n=>`今天完成 ${n} 次`, start:'開始', pause:'暫停', reset:'重設', skip:'跳到下一段', next:'下一首'},
  zh: {title:'Wayfen 学习计时器', sub:'Lo-fi 专注计时器', vol:'音乐音量', rest:'休息时也播放音乐', more:'更长的混音在 YouTube：', stream:'在各音乐平台收听：',
       focus:'专注', brk:'休息', sess:n=>`今天完成 ${n} 次`, start:'开始', pause:'暂停', reset:'重置', skip:'跳到下一段', next:'下一首'},
  id: {title:'Wayfen Timer Belajar', sub:'timer fokus lofi', vol:'Volume musik', rest:'Tetap putar musik saat istirahat', more:'Mix lebih panjang di YouTube:', stream:'Dengarkan di:',
       focus:'Fokus', brk:'Istirahat', sess:n=>`${n} sesi hari ini`, start:'Mulai', pause:'Jeda', reset:'Atur ulang', skip:'Lanjut ke tahap berikutnya', next:'Lagu berikutnya'},
  vi: {title:'Wayfen Đồng hồ học tập', sub:'đồng hồ tập trung lofi', vol:'Âm lượng nhạc', rest:'Vẫn mở nhạc khi nghỉ', more:'Bản mix dài hơn trên YouTube:', stream:'Nghe trên:',
       focus:'Tập trung', brk:'Nghỉ', sess:n=>`Đã xong ${n} lượt hôm nay`, start:'Bắt đầu', pause:'Tạm dừng', reset:'Đặt lại', skip:'Chuyển sang phần tiếp theo', next:'Bài tiếp theo'},
  th: {title:'Wayfen ตัวจับเวลาอ่านหนังสือ', sub:'ตัวจับเวลาโฟกัสพร้อมเพลง lofi', vol:'ระดับเสียงเพลง', rest:'เปิดเพลงต่อตอนพัก', more:'มิกซ์ที่ยาวกว่านี้บน YouTube:', stream:'ฟังได้ที่:',
       focus:'โฟกัส', brk:'พัก', sess:n=>`วันนี้ครบ ${n} รอบ`, start:'เริ่ม', pause:'หยุดชั่วคราว', reset:'รีเซ็ต', skip:'ข้ามไปช่วงถัดไป', next:'เพลงถัดไป'},
  ja: {title:'Wayfen 勉強タイマー', sub:'作業用ローファイ集中タイマー', vol:'音楽の音量', rest:'休憩中も音楽を流す', more:'長いミックスはYouTubeで：', stream:'各音楽サービスで聴く：',
       focus:'集中', brk:'休憩', sess:n=>`今日の完了：${n}回`, start:'スタート', pause:'一時停止', reset:'リセット', skip:'次へ進む', next:'次の曲'}};
let L = (new URLSearchParams(location.search).get('lang')) || (()=>{try{const v=localStorage.getItem('timer.lang');return v?JSON.parse(v):null}catch(e){return null}})() || ((l => l.startsWith('ko') ? 'ko' : l.startsWith('ja') ? 'ja' : /^zh-(tw|hk|mo|hant)/.test(l) ? 'tw' : l.startsWith('zh') ? 'zh' : /^(id|in|ms)/.test(l) ? 'id' : l.startsWith('vi') ? 'vi' : l.startsWith('th') ? 'th' : 'en')((navigator.language||'').toLowerCase()));
if (!T[L]) L = 'en';
function applyLang(){ document.documentElement.lang = L === 'tw' ? 'zh-Hant' : L === 'zh' ? 'zh-Hans' : L; document.querySelectorAll('[data-t]').forEach(e => e.textContent = T[L][e.dataset.t]);
  document.getElementById('reset').setAttribute('aria-label', T[L].reset); document.getElementById('skip').setAttribute('aria-label', T[L].skip);
  document.getElementById('next').setAttribute('aria-label', T[L].next);
  document.getElementById('lang').textContent = '🌐 ' + ({en:'EN',ko:'한',ja:'日',zh:'简',tw:'繁',id:'ID',vi:'VI',th:'TH'}[L] || 'EN'); }
const TRACKS = [
  ["bookshop_afternoon","Bookshop Afternoon"],["hearthside","Hearthside"],["cocoa_shop","Cocoa Shop"],
  ["frosted_glass","Frosted Glass"],["snow_dawn","Snow Dawn"],["sleepy_autumn","Sleepy Autumn"],
  ["first_snowfall","First Snowfall"],["footprints_home","Footprints Home"],["winter_market","Winter Market"],
  ["morning_shovel","Morning Shovel"],["snowbound","Snowbound"],["snow_village","Snow Village"]];
const $ = s => document.querySelector(s);
const store = {P:'timer.', get(k,d){try{let v=localStorage.getItem(this.P+k);if(v===null&&k!=='lang'&&k!=='tab'){v=localStorage.getItem(k)}if(v===null)return d;try{return JSON.parse(v)}catch(e){return v}}catch(e){return d}}, set(k,v){try{localStorage.setItem(this.P+k,JSON.stringify(v))}catch(e){}}};
const aud = $('#aud'); const R = 92, C = 2 * Math.PI * R; $('#prog').style.strokeDasharray = C;
let byUs = false, musicNeedsTap = false;
let endAt = 0, mode = store.get('mode', {f:25, r:5}), phase = 'focus', left = mode.f * 60, running = false, timer = null, ti = 0, lock = null;
// 하루마다 시작 곡이 바뀜. 오늘 직접 고른 곡이 있으면 그 곡 유지(11-09 대표님)
const DAY = Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
ti = (store.get('pickDay', -1) === DAY ? store.get('track', 0) : DAY) % TRACKS.length;
const today = new Date().toDateString(); let stats = store.get('stats', {d:today, n:0}); if (stats.d !== today) stats = {d:today, n:0};

// 곡
TRACKS.forEach(([id, name], i) => { const b = document.createElement('button'); b.className='trk'; b.id='tr-'+i;
  b.innerHTML = `<img src="art/${id}.jpg" alt="">${name}`; b.addEventListener('click', () => { store.set('pickDay', DAY); setTrack(i); if (running || !aud.paused) aud.play().catch(()=>{}) }); $('#tracks').appendChild(b) });
function setTrack(i){ ti = (i + TRACKS.length) % TRACKS.length; const [id, name] = TRACKS[ti]; aud.src = `music/${id}.mp3`; $('#tTitle').textContent = name;
  $('#bgart').style.backgroundImage = `url(art/${id}.jpg)`; document.querySelectorAll('.trk').forEach((b,k)=>b.setAttribute('aria-current', String(k===ti))); store.set('track', ti) }
aud.addEventListener('ended', () => { setTrack(ti + 1); aud.play().catch(()=>{}) });
$('#next').addEventListener('click', () => { const was = !aud.paused; setTrack(ti + 1); if (was || running) aud.play().catch(()=>{}) });
const vol = $('#vol'); vol.value = store.get('vol', 60); aud.volume = vol.value / 100;
vol.addEventListener('input', () => { aud.volume = vol.value / 100; store.set('vol', vol.value) });
$('#restMusic').checked = store.get('restMusic', true); $('#restMusic').addEventListener('change', e => store.set('restMusic', e.target.checked));

// 종소리 (파일 없이 소리 합성)
let ac = null;
function chime(){ try{ navigator.vibrate && navigator.vibrate([200, 100, 200]) }catch(e){}
  try{ const v = aud.volume; aud.volume = Math.min(v, 0.15); setTimeout(() => { aud.volume = vol.value / 100 }, 2500) }catch(e){}
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const t = ac.currentTime;
  [660, 880, 990].forEach((f,i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0, t+i*.18); g.gain.linearRampToValueAtTime(.18, t+i*.18+.02); g.gain.exponentialRampToValueAtTime(.001, t+i*.18+1.2); o.connect(g).connect(ac.destination); o.start(t+i*.18); o.stop(t+i*.18+1.3) }) }catch(e){} }

// 타이머
function total(){ return (phase === 'focus' ? mode.f : mode.r) * 60 }
function paint(){ const m = Math.floor(left/60), s = left % 60; $('#time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#phase').textContent = phase === 'focus' ? T[L].focus : T[L].brk; $('#phase').style.color = phase === 'focus' ? 'var(--accent)' : 'var(--rest)';
  $('#prog').style.stroke = phase === 'focus' ? 'var(--accent)' : 'var(--rest)';
  $('#prog').style.strokeDashoffset = C * (1 - left / total()); $('#count').textContent = T[L].sess(stats.n); $('#play').setAttribute('aria-label', running ? T[L].pause : T[L].start);
  document.title = running ? `${$('#time').textContent} · ${phase==='focus'?T[L].focus:T[L].brk}` : T[L].title }
function tick(){ const now = Date.now(), td = new Date().toDateString();
  if (stats.d !== td){ stats = {d:td, n:0}; store.set('stats', stats) }  // 자정 넘김
  if (endAt <= now){ if (phase === 'focus'){ stats.n++; store.set('stats', stats) } phase = phase === 'focus' ? 'rest' : 'focus'; endAt += total() * 1000;
    if (endAt <= now){ // 다음 단계까지 다 지나갔으면 자리를 비운 것: 세지 않고 이 단계 처음에서 멈춤
      pause(); left = total(); endAt = 0; saveRun(); paint(); return }
    chime(); musicForPhase(); saveRun() }
  left = Math.max(0, Math.ceil((endAt - now) / 1000)); paint() }
function musicForPhase(){ if (phase === 'rest' && !$('#restMusic').checked) aud.pause(); else if (running) aud.play().catch(()=>{}) }
// 진행 상태 저장: 새로고침·탭 닫힘 뒤에도 이어서
function saveRun(){ store.set('run', {phase, endAt, running, left}) }
function switchPhase(){ phase = phase === 'focus' ? 'rest' : 'focus'; left = total(); endAt = Date.now() + left * 1000; musicForPhase(); saveRun() }
async function start(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume() }catch(e){}
  endAt = Date.now() + left * 1000; running = true; $('#play').textContent = '❚❚'; $('#play').setAttribute('aria-label','Pause'); timer = setInterval(tick, 1000);
  if (!aud.src) setTrack(ti); if (phase === 'focus' || $('#restMusic').checked) aud.play().catch(()=>{});
  saveRun(); try{ lock = await navigator.wakeLock?.request('screen') }catch(e){ lock = null } paint() }
function pause(){ running = false; clearInterval(timer); $('#play').textContent = '▶'; $('#play').setAttribute('aria-label','Start'); if (!aud.paused){ byUs = true; aud.pause() } saveRun(); try{ lock && lock.release() }catch(e){} lock = null; paint() }
$('#play').addEventListener('click', () => running ? pause() : start());
$('#reset').addEventListener('click', () => { pause(); phase = 'focus'; left = total(); saveRun(); paint() });
$('#skip').addEventListener('click', () => { switchPhase(); paint() });
document.querySelectorAll('.modes .chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.modes .chip').forEach(x => x.setAttribute('aria-pressed', String(x===b)));
  mode = {f:+b.dataset.f, r:+b.dataset.r}; store.set('mode', mode); pause(); phase='focus'; left = total(); saveRun(); paint() }));
document.querySelectorAll('.modes .chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.f === mode.f)));
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && running){ tick(); if (running) try{ lock = await navigator.wakeLock?.request('screen') }catch(e){} } });
// 아이폰은 음량 조절을 막아 두므로 슬라이더를 숨김
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) $('#vol').closest('label').hidden = true;
// 언어: 누르면 목록이 펼쳐져 바로 고름(하나씩 넘기지 않음)
const LANGS_T = [['en','English'],['ko','한국어'],['ja','日本語'],['zh','简体中文'],['tw','繁體中文'],['id','Bahasa Indonesia'],['vi','Tiếng Việt'],['th','ไทย']];
function langMenu(open){ const m = $('#langMenu'); m.hidden = !open; $('#lang').setAttribute('aria-expanded', String(open));
